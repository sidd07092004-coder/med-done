server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS: resolve proxy targets at REQUEST time (not startup),
    # with a short cache. This makes deploy order irrelevant (frontend can start
    # before the backend exists) and picks up backend IP changes on redeploy.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Increase max body size for uploads
    client_max_body_size 12m;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Serve SPA with history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to backend.
    # proxy_pass with a VARIABLE is resolved per-request via the resolver above
    # (a literal hostname in proxy_pass would be resolved once at startup and
    # cached). $request_uri preserves the full original path + query string.
    location /api/ {
        set $backend "${BACKEND_ORIGIN}";
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        set $backend "${BACKEND_ORIGIN}";
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        set $backend "${BACKEND_ORIGIN}";
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
