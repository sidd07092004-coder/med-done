stages:
  - build-and-deploy

# Docker CLI image; talks to the host Docker daemon through the mounted socket.
image: docker:29.3.1

backend-build-and-deploy:
  stage: build-and-deploy
  variables:
    # Container / image naming
    CONTAINER_NAME: "Medically-Complicated-admin-backend-v2"
    IMAGE_NAME: "medically-complicated-admin-backend-image-v2"

    # Ports: published host port -> port the app listens on inside the container
    CONTAINER_PORT: "1008"
    CONTAINER_INTERNAL_PORT: "8000"

    # Docker network shared with other services, and this service's alias on it
    NETWORK_NAME: "mc-admin-net"
    NETWORK_ALIAS: "mc-admin-backend"

    # Build context and Dockerfile (relative to the repo root)
    BACKEND_CONTEXT: "backend"
    BACKEND_DOCKERFILE: "backend/Dockerfile"

    # Frontend origins allowed by CORS (JSON list)
    BACKEND_CORS_ORIGINS: '["http://localhost:5173","http://localhost:5174","http://10.2.22.108:1006","http://10.2.22.108:1008","http://10.2.22.108:1009"]'
    DOCKER_HOST: "unix:///var/run/docker.sock"

    # Media storage: uploads are written to the remote server over SFTP.
    # The password and known_hosts data are NOT set here; they come from
    # protected CI/CD variables (see before_script checks).
    MEDIA_STORAGE_BACKEND: "sftp"
    MEDIA_SFTP_HOST: "10.2.22.108"
    MEDIA_SFTP_PORT: "22"
    MEDIA_SFTP_USERNAME: "aumble"
    MEDIA_SFTP_REMOTE_DIR: "/home/aumble/medically_complicated_data/uploads"
    MEDIA_SFTP_CONNECT_TIMEOUT: "10"

    # Host folder (same location as the SFTP target) mounted read-only into the
    # container at /app/uploads so uploaded files can be served.
    MEDIA_UPLOAD_HOST_DIR: "/home/aumble/medically_complicated_data/uploads"
  before_script:
    - apk add --no-cache curl
    # Fail fast if required secrets are missing from the CI/CD variables.
    - 'test -n "${DATABASE_URL:-}" || { echo "FATAL: DATABASE_URL CI/CD variable is not set"; exit 1; }'
    - 'test -n "${SECRET_KEY:-}"   || { echo "FATAL: SECRET_KEY CI/CD variable is not set";   exit 1; }'
    - 'test -n "${MEDIA_SFTP_PASSWORD:-}" || { echo "FATAL: MEDIA_SFTP_PASSWORD CI/CD variable is not set"; exit 1; }'
    - 'test -n "${MEDIA_SFTP_KNOWN_HOSTS_DATA:-}" || { echo "FATAL: MEDIA_SFTP_KNOWN_HOSTS_DATA CI/CD variable is not set"; exit 1; }'
    # The bind-mount source must be an absolute path on the Docker host.
    - 'case "$MEDIA_UPLOAD_HOST_DIR" in /*) ;; *) echo "FATAL: MEDIA_UPLOAD_HOST_DIR must be an absolute path on the Docker host"; exit 1;; esac'
  script:
    # 1. Create the shared network (ignore the error if it already exists).
    - docker network create "${NETWORK_NAME}" || true

    # 2. Build the image, tagged with the commit SHA and "latest".
    - docker build -t "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}" -t "${IMAGE_NAME}:latest" -f "${BACKEND_DOCKERFILE}" "${BACKEND_CONTEXT}"

    # 3. Verify SFTP login and write access to the upload directory BEFORE
    #    replacing the running container. A failure here stops the deploy.
    #    (--env NAME without a value passes the CI variable through without
    #    printing it in the job log.)
    - |
      echo "Checking password-authenticated SFTP access and upload-directory permissions..."
      docker run --rm \
        --entrypoint python \
        -e "MEDIA_STORAGE_BACKEND=${MEDIA_STORAGE_BACKEND}" \
        -e "MEDIA_SFTP_HOST=${MEDIA_SFTP_HOST}" \
        -e "MEDIA_SFTP_PORT=${MEDIA_SFTP_PORT}" \
        -e "MEDIA_SFTP_REMOTE_DIR=${MEDIA_SFTP_REMOTE_DIR}" \
        -e "MEDIA_SFTP_CONNECT_TIMEOUT=${MEDIA_SFTP_CONNECT_TIMEOUT}" \
        --env MEDIA_SFTP_USERNAME \
        --env MEDIA_SFTP_PASSWORD \
        --env MEDIA_SFTP_KNOWN_HOSTS_DATA \
        "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}" \
        -c 'import asyncio; from app.services.media_storage import verify_remote_write_access; asyncio.run(verify_remote_write_access())'

    # 4. Remove the old container (ignore the error if there isn't one).
    - docker rm -f "${CONTAINER_NAME}" || true

    # 5. Start the new container from the freshly built image.
    - >
      docker run -d
      --name "${CONTAINER_NAME}"
      --restart unless-stopped
      --network "${NETWORK_NAME}"
      --network-alias "${NETWORK_ALIAS}"
      -p "${CONTAINER_PORT}:${CONTAINER_INTERNAL_PORT}"
      --mount "type=bind,source=${MEDIA_UPLOAD_HOST_DIR},target=/app/uploads,readonly"
      -e "DATABASE_URL=${DATABASE_URL}"
      -e "SECRET_KEY=${SECRET_KEY}"
      -e "BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}"
      -e "UPLOAD_DIR=/app/uploads"
      -e "MEDIA_STORAGE_BACKEND=${MEDIA_STORAGE_BACKEND}"
      -e "MEDIA_SFTP_HOST=${MEDIA_SFTP_HOST}"
      -e "MEDIA_SFTP_PORT=${MEDIA_SFTP_PORT}"
      -e "MEDIA_SFTP_REMOTE_DIR=${MEDIA_SFTP_REMOTE_DIR}"
      -e "MEDIA_SFTP_CONNECT_TIMEOUT=${MEDIA_SFTP_CONNECT_TIMEOUT}"
      --env MEDIA_SFTP_USERNAME
      --env MEDIA_SFTP_PASSWORD
      --env MEDIA_SFTP_KNOWN_HOSTS_DATA
      -e "ENVIRONMENT=production"
      -e "PORT=${CONTAINER_INTERNAL_PORT}"
      -e "DB_WAIT_TIMEOUT=60"
      "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"

    # 6. Health check: poll /health for up to ~60s (30 tries, 2s apart).
    #    If it never responds, print recent logs and fail the job.
    - |
      for i in $(seq 1 30); do
        if docker exec "${CONTAINER_NAME}" curl -fsS "http://127.0.0.1:${CONTAINER_INTERNAL_PORT}/health"; then
          echo ""
          echo "Backend container is healthy!"
          exit 0
        fi
        echo "waiting for backend (attempt ${i}/30) ..."
        sleep 2
      done
      echo "FATAL: backend container did not become healthy"
      docker logs --tail 100 "${CONTAINER_NAME}" || true
      exit 1
  # Run only on the reference-v2 branch, on the runner tagged docker-EPS.
  only:
    refs:
      - reference-v2
  tags:
    - docker-EPS